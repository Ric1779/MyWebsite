# Reusable tooltip definitions.
# Reference any key from a blog post like:
#   {{< tooltip text="CPU" id="cpu" />}}
#
# Multi-line entries: use the "|" block scalar.
# Inline markdown (**bold**, *italic*, `code`, [links](url)) is rendered.

cpu: |
  The **Central Processing Unit** — fetches, decodes, and
  executes one instruction at a time.

instruction-pointer: A CPU register holding the address of the next instruction to execute. Also called the *program counter*.

instruction: An instruction is a binary command that tells the CPU to perform a single operation like moving data, doing arithmetic, or changing execution flow.

control-flow: Decisions about which instruction the CPU executes next (jumps, branches, calls).

register: A CPU register is a tiny, ultra-fast memory unit inside the processor that temporarily stores data the CPU is actively using.
